<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What Grows Together</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><a href="#" id="home">What Grows Together</a></h1>
      <p class="muted motto">“What grows together goes together.” An old kitchen saying.</p>
    </div>
    <nav id="modeNav" aria-label="Browse by"></nav>
  </header>

  <div class="controls">
    <input id="q" type="search" placeholder="Search…" autocomplete="off" aria-label="Search">
    <p><span class="muted">In season:</span> <span id="seasonNav"></span></p>
    <p id="catRow"><span class="muted">Category:</span> <span id="cats"></span></p>
  </div>

  <section id="plate" aria-label="Your plate"></section>
  <article id="card" aria-live="polite"></article>

  <section id="index" aria-label="Index">
    <h2 id="indexTitle">Index</h2>
    <p class="muted" id="count"></p>
    <div id="list"></div>
  </section>

  <footer>Pairings are an original starter set drawn from common culinary practice. <b>BOLD CAPS</b> mark classic matches. Edit <code>data.js</code> to add your own.</footer>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
